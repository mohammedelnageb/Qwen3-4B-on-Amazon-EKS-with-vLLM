# vLLM OpenAI-compatible server for Qwen3-4B on CPU (m7i.2xlarge: 8 vCPU, 32 GiB, AMX/AVX-512).
# Requires the secret: kubectl -n llm create secret generic vllm-api-key --from-literal=key=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate # one inference node: stop the old pod before starting the new one
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      enableServiceLinks: false
      nodeSelector:
        role: inference
      tolerations:
        - key: workload
          operator: Equal
          value: inference
          effect: NoSchedule
      containers:
        - name: vllm
          # Official vLLM x86 CPU image; pin a version tag after the first successful run
          image: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:latest
          args:
            - /models/Qwen3-4B-Instruct-2507
            - --safetensors-load-strategy=prefetch
            - --served-model-name=qwen3-4b
            - --host=0.0.0.0
            - --port=8000
            - --dtype=bfloat16
            - --max-model-len=8192
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: key
            - name: HF_HUB_OFFLINE
              value: "1"
            # KV cache size in GiB (lives in RAM on CPU)
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "8"
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: "auto"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "6500m" # leave room for DaemonSets on the 8 vCPU node
              memory: 24Gi
            limits:
              memory: 28Gi
          # CPU model load is slower: allow up to 15 min before liveness kicks in
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: qwen-models
            readOnly: true
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llm
  labels:
    app: vllm
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
