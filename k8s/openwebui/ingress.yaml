# Public ALB for Open WebUI (HTTP, no domain yet), open to anyone with the URL.
# vLLM stays internal (ClusterIP); users reach it only through Open WebUI's login.
# Requires the AWS Load Balancer Controller (installed with Helm).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui
  namespace: llm
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip # route straight to pod IPs
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # Open to anyone with the URL. To restrict, use specific IPs, comma-separated.
    alb.ingress.kubernetes.io/inbound-cidrs: 0.0.0.0/0
    # Long LLM answers stream for minutes: raise the 60s default idle timeout
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    # LATER (with a domain + ACM certificate), switch to HTTPS:
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:<account>:certificate/<id>
    # alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openwebui
                port:
                  number: 8080
